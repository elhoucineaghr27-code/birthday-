<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:black;
      font-family:Arial;
    }

    .item{
      position:absolute;
      color:white;
      font-size:20px;
      animation:fall 5s linear forwards;
      white-space:nowrap;
    }

    @keyframes fall{
      from{
        top:-40px;
      }

      to{
        top:100vh;
        opacity:0;
      }
    }

    h1{
      text-align:center;
      color:pink;
      margin-top:20px;
      font-size:40px;
      text-shadow:0 0 20px hotpink;
    }
  </style>
</head>

<body>

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<script>

const items = [
"🎂Happy Birthday!",
"🎂",
"🤍",
"🎉",
"🎁",
"Happy Birthday!🎇",
"🎈"
];

function createItem(){

  let div = document.createElement("div");

  div.className = "item";

  div.innerText =
  items[Math.floor(Math.random()*items.length)];

  div.style.left =
  Math.random()*window.innerWidth + "px";

  document.body.appendChild(div);

  setTimeout(()=>{
    div.remove();
  },4000);
}

setInterval(createItem,200);

</script>

</body>
</html>
