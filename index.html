<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>
  <style>
    body{
      margin:0;
      overflow:hidden;
      background:white;
      font-family:Arial;
    }
    .item{
      position:absolute;
      color:gold;
      font-size:30px;
      animation:fall 3s linear forwards;
      white-space:nowrap;
    }
    @keyframes fall{
      from{
        top:-50px;
        opacity:1;
      }
      to{
        top:100vh;
        opacity:0;
      }
    }
    h1{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      color:#ff1493;
      margin:0;
      font-size:50px;
      text-shadow:0 0 20px #ff69b4;
      z-index:10;
      background:rgba(255,255,255,0.9);
      padding:20px 40px;
      border-radius:20px;
    }
  </style>
</head>
<body>
<h1>🎂 HAPPY BIRTHDAY 🎂</h1>
<script>
const items = [
"🎂Happy Birthday!",
"🎂",
"🤍",
"🎉",
"🎁",
"Happy Birthday!🎇",
"🎈"
];

function createItem(){
  let div = document.createElement("div");
  div.className = "item";
  div.innerText = items[Math.floor(Math.random()*items.length)];
  
  // Position aléatoire mais dans les limites de l'écran (avec marge de 10%)
  const maxLeft = window.innerWidth * 0.9;
  div.style.left = (Math.random() * maxLeft) + "px";
  
  document.body.appendChild(div);
  
  setTimeout(()=>{
    div.remove();
  },3500);
}

setInterval(createItem, 200);
</script>
</body>
</html>
