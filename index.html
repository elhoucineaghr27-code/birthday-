<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:linear-gradient(to bottom,#fff,#ffe6f0);
      font-family:Arial;
    }

    .item{
      position:absolute;
      color:gold;
      font-size:30px;
      white-space:nowrap;

      text-shadow:0 0 10px gold;

      user-select:none;
      pointer-events:none;
    }

    h1{
      text-align:center;
      color:pink;
      margin-top:20px;
      font-size:50px;
      text-shadow:0 0 20px pink;
    }
  </style>
</head>

<body>

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<script>

const items = [
"🎂Happy Birthday!",
"🎂",
"🤍",
"🎉",
"🎁",
"Happy Birthday!🎇",
"🎈"
];

function createItem(){

  let div = document.createElement("div");

  div.className = "item";

  div.innerText =
  items[Math.floor(Math.random()*items.length)];

  // random position
  div.style.left =
  Math.random()*window.innerWidth + "px";

  div.style.top =
  Math.random()*window.innerHeight + "px";

  // random size
  div.style.fontSize =
  (20 + Math.random()*30) + "px";

  document.body.appendChild(div);
}

for(let i = 0; i < 40; i++){
  createItem();
}

</script>

</body>
</html>
