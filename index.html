<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>

  <style>
    body{
      margin:0;
      overflow:hidden;
      background:linear-gradient(to bottom,#fff,#ffe6f0);
      font-family:Arial;
    }

    .item{
      position:absolute;

      color:gold;
      font-size:30px;
      white-space:nowrap;

      animation:fall 4s linear forwards;

      text-shadow:0 0 10px gold;

      user-select:none;
      pointer-events:none;
    }

    @keyframes fall{

      from{
        top:-50px;
        opacity:1;
        transform:rotate(0deg);
      }

      to{
        top:100vh;
        opacity:0;
        transform:rotate(360deg);
      }
    }

    h1{
      text-align:center;
      color:pink;
      margin-top:20px;
      font-size:50px;
      text-shadow:0 0 20px pink;
      animation:glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        transform:scale(1);
      }

      to{
        transform:scale(1.05);
      }
    }
  </style>
</head>

<body>

<h1>🎂 HAPPY BIRTHDAY 🎂</h1>

<script>

const items = [
"🎂Happy Birthday!",
"🎂",
"🤍",
"🎉",
"🎁",
"Happy Birthday!🎇",
"🎈"
];

function createItem(){

  let div = document.createElement("div");

  div.className = "item";

  div.innerText =
  items[Math.floor(Math.random()*items.length)];

  // Position horizontal
  div.style.left =
  Math.random()*window.innerWidth + "px";

  // Size random
  div.style.fontSize =
  (20 + Math.random()*30) + "px";

  // Speed random
  div.style.animationDuration =
  (2 + Math.random()*3) + "s";

  document.body.appendChild(div);

  setTimeout(()=>{
    div.remove();
  },5000);
}

setInterval(createItem,150);

</script>

</body>
</html>
