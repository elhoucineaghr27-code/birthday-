<!DOCTYPE html>
<html>
<head>
  <title>Happy Birthday 🎂</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{
      margin:0;
      overflow:hidden;
      background:white;
      font-family:Arial;
    }
    .item{
      position:absolute;
      color:gold;
      font-size:25px;
      animation:fall 3s linear forwards;
      white-space:nowrap;
    }
    @keyframes fall{
      from{
        top:-50px;
        opacity:1;
      }
      to{
        top:100vh;
        opacity:0;
      }
    }
    h1{
      position:fixed;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      color:#ff1493;
      margin:0;
      font-size:35px;
      text-shadow:0 0 15px #ff69b4;
      z-index:10;
      background:rgba(255,255,255,0.9);
      padding:15px 25px;
      border-radius:15px;
      text-align:center;
      white-space:nowrap;
      max-width:90%;
    }
    
    /* Pour les petits écrans */
    @media (max-width: 600px) {
      h1{
        font-size:18px;
        padding:12px 20px;
        border-radius:12px;
        white-space:normal;
        line-height:1.4;
        max-width:85%;
      }
      .item{
        font-size:18px;
      }
    }
  </style>
</head>
<body>
<h1>🎂 HAPPY<br>BIRTHDAY 🎂</h1>
<script>
const items = [
"🎂Happy Birthday!",
"🎂",
"🤍",
"🎉",
"🎁",
"Happy Birthday!🎇",
"🎈"
];

function createItem(){
  let div = document.createElement("div");
  div.className = "item";
  div.innerText = items[Math.floor(Math.random()*items.length)];
  
  const maxLeft = window.innerWidth * 0.80;
  div.style.left = (Math.random() * maxLeft) + "px";
  
  document.body.appendChild(div);
  
  setTimeout(()=>{
    div.remove();
  },3500);
}

setInterval(createItem, 200);
</script>
</body>
</html>
